[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saraung Babu", email = "saraung.babu@yatnam.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cloudinary>=1.44",
    "email-validator>=2.2",
    "fastapi>=0.143.2",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9",
    "redis>=5.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package=false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
